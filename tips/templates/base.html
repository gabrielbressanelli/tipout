{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>{% block title %}Tipout{% endblock %}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'tips/brand/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'tips/brand/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'tips/brand/favicon-16x16.png' %}">
    <link rel="shortcut icon" href="{% static 'tips/brand/favicon.ico' %}">
    <link rel="manifest" href="{% static 'tips/brand/site.webmanifest' %}">
    <meta name="theme-color" content="#f4f7f8">
    <link rel="stylesheet" href="{% static 'tips/styles.css' %}">
    <script src="{% static 'tips/toasts.js' %}" defer></script>
    <script src="{% static 'tips/nav.js' %}" defer></script>
</head>
<body>
    {% if messages %}
        <div class="toast-region" aria-live="polite" aria-label="Notifications">
            {% for message in messages %}
                <div class="toast toast-{{ message.tags|default:'info' }}" role="status" data-timeout="4000">
                    <span class="toast-status-dot" aria-hidden="true"></span>
                    <span class="toast-copy">{{ message }}</span>
                    <button class="toast-close" type="button" aria-label="Dismiss notification">&times;</button>
                    <span class="toast-timer" aria-hidden="true"></span>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'dashboard' %}">
                <img class="brand-logo" src="{% static 'tips/brand/logo-final.png' %}" alt="Tipout">
            </a>
            {% if user.is_authenticated %}
                <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="primary-nav" aria-expanded="false">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </button>
                <button class="nav-backdrop" type="button" aria-label="Close menu" data-nav-close></button>
                <nav class="topnav" id="primary-nav" aria-label="Primary navigation">
                    <div class="drawer-head">
                        <span>Menu</span>
                        <button class="drawer-close" type="button" aria-label="Close menu" data-nav-close>&times;</button>
                    </div>
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <a href="{% url 'paycheck_history' %}">Paychecks</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="logout-button" type="submit">Log out</button>
                    </form>
                </nav>
            {% endif %}
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
